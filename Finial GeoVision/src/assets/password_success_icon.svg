<svg width="140" height="125" viewBox="0 0 140 125" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shackle / Lock Arch Loop -->
  <path 
    d="M 46 48 V 30 C 46 16.5 56.5 5.5 70 5.5 C 83.5 5.5 94 16.5 94 30 V 48" 
    stroke="#4B92DB" 
    stroke-width="12.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  <!-- Shackle Right Highlight -->
  <path 
    d="M 94 25 C 94 18 90 12 85 9" 
    stroke="#FFFFFF" 
    stroke-width="2.2" 
    stroke-linecap="round" 
  />

  <!-- Main Lock Body -->
  <rect x="33" y="42" width="74" height="54" rx="14" fill="#4B92DB" />
  
  <!-- Lock Top Edge Highlight -->
  <path 
    d="M 39 52 C 39 46 43 44 48 44 H 92" 
    stroke="#FFFFFF" 
    stroke-width="2" 
    stroke-linecap="round" 
    opacity="0.8"
  />

  <!-- Keyhole in Lock Center -->
  <circle cx="70" cy="62.5" r="5.5" fill="#FAFBFD" />
  <path d="M 66.5 64 L 73.5 64 L 74.5 75.5 C 74.5 76.5 73.5 77 72.5 77 H 67.5 C 66.5 77 65.5 76.5 65.5 75.5 Z" fill="#FAFBFD" />

  <!-- Angled Password Bar Pill with 4 Asterisks -->
  <g transform="translate(4, 10) rotate(-10 75 88)">
    <!-- Pill Capsule with Crisp White Stroke -->
    <rect x="35" y="74" width="94" height="27" rx="13.5" fill="#1B559C" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- Asterisk 1 -->
    <g transform="translate(53, 87.5)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="-3" x2="5.2" y2="3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="3" x2="5.2" y2="-3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="0" cy="0" r="1.7" fill="#FAFBFD" />
    </g>
    <!-- Asterisk 2 -->
    <g transform="translate(71, 87.5)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="-3" x2="5.2" y2="3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="3" x2="5.2" y2="-3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="0" cy="0" r="1.7" fill="#FAFBFD" />
    </g>
    <!-- Asterisk 3 -->
    <g transform="translate(89, 87.5)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="-3" x2="5.2" y2="3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="3" x2="5.2" y2="-3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="0" cy="0" r="1.7" fill="#FAFBFD" />
    </g>
    <!-- Asterisk 4 -->
    <g transform="translate(107, 87.5)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="-3" x2="5.2" y2="3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <line x1="-5.2" y1="3" x2="5.2" y2="-3" stroke="#FAFBFD" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="0" cy="0" r="1.7" fill="#FAFBFD" />
    </g>
  </g>

  <!-- Security Shield with Checkmark (Overlapping on bottom left) -->
  <g>
    <!-- Shield with White Border -->
    <path 
      d="M 5 69 C 5 61 24 53 25 53 C 26 53 45 61 45 69 C 45 88 26 107 25 108 C 24 107 5 88 5 69 Z" 
      fill="#013A78" 
      stroke="#FFFFFF" 
      stroke-width="2.8" 
      stroke-linejoin="round" 
    />
    <!-- Checkmark inside Shield -->
    <path 
      d="M 14.5 77.5 L 21.5 84.5 L 35 66.5" 
      stroke="#FFFFFF" 
      stroke-width="3.8" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>
